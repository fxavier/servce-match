name: mobile
description: "ServiMatch — app unica (cliente/prestador), iOS + Android."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado / DI
  flutter_riverpod: ^2.6.1

  # Navegacao / deep links
  go_router: ^14.6.2

  # Rede
  dio: ^5.7.0
  retrofit: ^4.4.1
  pretty_dio_logger: ^1.4.0

  # Modelos
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Autenticacao (RFC 8252) + storage seguro
  flutter_appauth: ^7.0.1
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1

  # i18n
  intl: ^0.19.0

  # Utilitarios
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  retrofit_generator: ^9.1.5

  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
