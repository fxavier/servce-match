# Perfil de teste para as suítes de integração HTTP dos módulos requests/
# chat (agente backend-domain) que precisam de uma base de dados real
# (CLAUDE.md, critérios de aceitação: "provado contra a BD real"). Mesmo
# padrão que application-payments-it.yml/application-uploads-it.yml: o
# application.yml de teste (agente qa-e2e/backend-platform, não editado
# aqui) exclui DataSource/Flyway/registo de eventos JDBC por omissão —
# este ficheiro NOVO (não sobrepõe o existente) reativa-os apenas quando
# este perfil está ativo (`@ActiveProfiles("requests-it")`).
#
# Fonte da base de dados: pt.servimatch.testsupport.SharedPostgis, ligada
# via @DynamicPropertySource nos testes que ativam este perfil.
spring:
  autoconfigure:
    exclude: []
  datasource:
    hikari:
      # Ver comentário equivalente em application-notifications-it.yml. Este
      # é o perfil mais reutilizado (10 classes de teste, cada uma com o seu
      # próprio contexto por causa do @DynamicPropertySource específico da
      # classe) — era o maior contribuinte para o esgotamento de ligações.
      # Confirmado (grep por ExecutorService/Thread/CompletableFuture/Latch
      # em backend/src/test/java): nenhum teste destes módulos depende de
      # concorrência real dentro de um único contexto, incluindo
      # ListConversationsIntegrationTest (o `Thread.sleep` aí é só para
      # ordenar timestamps, não é execução paralela) — 2 chega e nunca
      # bloqueia.
      maximum-pool-size: 2
      minimum-idle: 1
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  modulith:
    events:
      republish-outstanding-events-on-restart: false
