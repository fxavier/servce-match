# Perfil de teste para as suítes de integração HTTP dos módulos
# billing/payments (agente backend-payments) que precisam de uma base de
# dados real (CLAUDE.md, critérios de aceitação: "provado contra a BD
# real"). O application.yml de teste (agente qa-e2e/backend-platform, não
# editado aqui) exclui DataSource/Flyway/registo de eventos JDBC por
# omissão — este ficheiro NOVO (não sobrepõe o existente) reativa-os
# apenas quando este perfil está ativo (`@ActiveProfiles("payments-it")`).
#
# Fonte da base de dados: pt.servimatch.testsupport.SharedPostgis, ligada
# via @DynamicPropertySource nos testes que ativam este perfil.
spring:
  autoconfigure:
    exclude: []
  datasource:
    hikari:
      # Ver comentário equivalente em application-notifications-it.yml:
      # cada classe de teste com @ActiveProfiles("payments-it") arranca o
      # seu próprio ApplicationContext/pool Hikari (o @DynamicPropertySource
      # é específico da classe, o que impede a partilha de contexto mesmo
      # com o mesmo nome de perfil), e todos ficam em cache vivos em
      # simultâneo até ao fim da JVM — a soma dos pools default (10) contra
      # o mesmo SharedPostgis esgotava `max_connections`. Nenhum teste deste
      # módulo depende de concorrência real dentro de um único contexto.
      maximum-pool-size: 2
      minimum-idle: 1
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  modulith:
    events:
      republish-outstanding-events-on-restart: false
