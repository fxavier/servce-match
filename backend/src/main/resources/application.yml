# Configuração base do backend ServiMatch.
#
# Nenhum segredo aqui: tudo o que é sensível vem de variável de ambiente
# (ver backend/.env.example). Perfis:
#   - (nenhum / omissão) — single-instance (ADR-0006): rate limiting e
#     idempotência em memória.
#   - multi-instance      — ativa Redis para rate limiting e idempotência
#     (ver application-multi-instance.yml).
#
# Ownership: pt.servimatch.platform / pt.servimatch.config (agente
# backend-platform). Módulos de domínio não editam este ficheiro; pedem
# propriedades novas ao dono.

spring:
  application:
    name: servimatch-backend

  # ---------------------------------------------------------------------
  # Spring Modulith (ADR-0001)
  # ---------------------------------------------------------------------
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          # O esquema do Event Publication Registry é gerido por Flyway
          # (agente db-migrations), não por auto-inicialização — "zero
          # alterações manuais de esquema" (docs/ARQUITETURA.md §5.6).
          enabled: false
      # Entrega at-least-once: reprocessa publicações incompletas no
      # arranque. Handlers @ApplicationModuleListener têm de ser
      # idempotentes.
      republish-outstanding-events-on-restart: true
      completion-mode: UPDATE
      staleness:
        published: PT1H
        processing: PT30M
        resubmitted: PT2H

  # ---------------------------------------------------------------------
  # Base de dados (PostgreSQL + PostGIS) e migrações (Flyway; ficheiros
  # geridos pelo agente db-migrations em src/main/resources/db/migration)
  # ---------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servimatch}
    username: ${DB_USERNAME:servimatch}
    password: ${DB_PASSWORD:servimatch}
    hikari:
      # Não bloquear/falhar o arranque se a base de dados ainda não estiver
      # pronta (ordem de arranque do docker-compose); a primeira operação
      # real é que acusa a falha.
      initialization-fail-timeout: -1
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ---------------------------------------------------------------------
  # Redis (ADR-0006): sempre configurável; só usado quando
  # servimatch.rate-limit.backend=redis ou servimatch.idempotency.backend=redis.
  # ---------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ---------------------------------------------------------------------
# Segurança — OAuth2 Resource Server (ADR-0002/0009)
# ---------------------------------------------------------------------
servimatch:
  security:
    jwt:
      # jwk-set-uri aponta diretamente para o JWKS do realm — evita uma
      # descoberta OIDC síncrona no arranque (ver SecurityConfig).
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/servimatch/protocol/openid-connect/certs}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/servimatch}
      expected-audience: ${KEYCLOAK_AUDIENCE:servimatch-backend}
      roles-claim: realm_access.roles

  # -------------------------------------------------------------------
  # Rate limiting (Bucket4j, ADR-0006) — limite global por cliente.
  # Limites mais apertados por endpoint ficam ao critério de cada módulo
  # via RateLimiterService.
  # -------------------------------------------------------------------
  rate-limit:
    enabled: true
    capacity: 120
    refill-period: PT1M
    backend: in-memory
    # CIDR (ou IP exato) dos proxies/load balancers de confiança cujo
    # X-Forwarded-For é honrado para identificar o cliente. Vazio por
    # omissão: sem um proxy configurado explicitamente aqui, o cabeçalho
    # NUNCA é confiável (é trivialmente forjável por qualquer chamador) e
    # usa-se sempre o IP da ligação TCP. Preencher em produção com o(s)
    # CIDR do load balancer/reverse proxy real — nunca com "0.0.0.0/0".
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    # Limite dedicado, mais apertado, para /v1/webhooks/** — aplicado além
    # do limite global acima, não em substituição dele (o endpoint é
    # público por desenho e persiste o corpo do pedido antes de validar a
    # assinatura do gateway).
    webhook:
      capacity: 20
      refill-period: PT1M

  # -------------------------------------------------------------------
  # Idempotência (Idempotency-Key em escritas não idempotentes)
  # -------------------------------------------------------------------
  idempotency:
    header-name: Idempotency-Key
    retention: P1D
    backend: in-memory

  # -------------------------------------------------------------------
  # Housekeeping do Event Publication Registry
  # -------------------------------------------------------------------
  events:
    completed-retention: P7D
    purge-cron: "0 15 3 * * *"

  # -------------------------------------------------------------------
  # Estado de versão da app (platform/appversion, GET /v1/app/version-status)
  # — regra inteiramente por configuração, sem tabela nem deploy do
  # cliente para mudar (ver AppVersionController). Atualizar aqui (ou via
  # variável de ambiente) é o único mecanismo para forçar/recomendar
  # atualização.
  # -------------------------------------------------------------------
  app-version:
    platforms:
      IOS:
        min-supported-version: ${APP_VERSION_IOS_MIN:1.0.0}
        latest-version: ${APP_VERSION_IOS_LATEST:1.0.0}
        store-url: ${APP_VERSION_IOS_STORE_URL:https://apps.apple.com/pt/app/servimatch}
      ANDROID:
        min-supported-version: ${APP_VERSION_ANDROID_MIN:1.0.0}
        latest-version: ${APP_VERSION_ANDROID_LATEST:1.0.0}
        store-url: ${APP_VERSION_ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=pt.servimatch}
      WEB:
        min-supported-version: ${APP_VERSION_WEB_MIN:1.0.0}
        latest-version: ${APP_VERSION_WEB_LATEST:1.0.0}
        store-url: ""

  # -------------------------------------------------------------------
  # Uploads (modules/uploads) — object storage compatível S3 (ARQUITETURA
  # §14: Amazon S3/Cloudflare R2 em produção, MinIO em desenvolvimento —
  # ver infra/docker-compose.yml, bucket "servimatch-uploads", privado).
  # Credenciais por omissão coincidem com as de desenvolvimento do MinIO
  # local (infra/.env.example MINIO_ROOT_USER/PASSWORD) — nunca segredos
  # reais; em produção, deixar UPLOADS_S3_ACCESS_KEY/SECRET_KEY vazios usa
  # a cadeia de credenciais por omissão (IAM), ver UploadsStorageConfig.
  # -------------------------------------------------------------------
  uploads:
    endpoint: ${UPLOADS_S3_ENDPOINT:http://localhost:9000}
    region: ${UPLOADS_S3_REGION:eu-west-1}
    bucket: ${UPLOADS_S3_BUCKET:servimatch-uploads}
    access-key: ${UPLOADS_S3_ACCESS_KEY:servimatch}
    secret-key: ${UPLOADS_S3_SECRET_KEY:servimatch123}
    path-style-access: ${UPLOADS_S3_PATH_STYLE:true}
    upload-url-ttl: PT15M
    download-url-ttl: PT1H
    pending-retention: P1D
    expiry-cron: "0 30 3 * * *"
    purposes:
      REQUEST_ATTACHMENT:
        max-size-bytes: 8388608
        allowed-content-types: [image/jpeg, image/png, image/webp]
      MESSAGE_ATTACHMENT:
        max-size-bytes: 15728640
        allowed-content-types: [image/jpeg, image/png, image/webp, application/pdf]
      PROVIDER_PORTFOLIO:
        max-size-bytes: 8388608
        allowed-content-types: [image/jpeg, image/png, image/webp]
      PROVIDER_DOCUMENT:
        max-size-bytes: 15728640
        allowed-content-types: [application/pdf, image/jpeg, image/png]
      AVATAR:
        max-size-bytes: 2097152
        allowed-content-types: [image/jpeg, image/png, image/webp]

# ---------------------------------------------------------------------
# Observabilidade
# ---------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Endpoints sensíveis (env, beans, configprops, heapdump, ...)
        # ficam fechados por omissão — só o estritamente necessário à
        # orquestração e a scraping de métricas é exposto.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    # Redis só é usado quando um backend=redis está ativo (ver
    # application-multi-instance.yml, que reativa este indicador).
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    pt.servimatch: INFO

server:
  port: ${SERVER_PORT:8080}
